plugins {
    id 'java'
    id 'org.springframework.boot' version '4.2.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.swaroop.rag'
version = '0.0.1'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

repositories { mavenCentral() }

dependencyManagement {
    imports { mavenBom 'org.springframework.ai:spring-ai-bom:2.1.0' }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.ai:spring-ai-starter-model-ollama'
    implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'
    implementation 'org.springframework.ai:spring-ai-rag'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.register('listJars') {
    doLast { configurations.runtimeClasspath.files.findAll { it.name.startsWith('spring-ai') }.each { println it } }
}
